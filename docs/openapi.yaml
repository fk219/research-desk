openapi: 3.1.0
info:
  title: ResearchDesk API
  version: 1.0.0
  description: Sourced research threads. Client authentication uses an httpOnly session cookie.
servers:
  - url: https://research-desk-api.onrender.com
  - url: http://localhost:3000
tags:
  - name: Health
  - name: Auth
  - name: Chats
  - name: Public
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness and database state
      responses:
        "200": { description: API is running }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness with Mongo ping
      responses:
        "200": { description: Database is reachable }
        "503": { description: Database is not reachable }
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201": { description: Created }
        "400": { description: Validation error }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      responses:
        "200": { description: Session cookie issued }
        "401": { description: Invalid credentials }
  /api/auth/demo:
    post:
      tags: [Auth]
      summary: Open the shared demo desk
      responses:
        "200": { description: Demo session }
  /api/auth/get-me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        "200": { description: User }
        "401": { description: Unauthenticated }
  /api/auth/quota:
    get:
      tags: [Auth]
      summary: Daily quota
      responses:
        "200": { description: Remaining messages }
  /api/chats:
    get:
      tags: [Chats]
      summary: List chats
      responses:
        "200": { description: Chats }
  /api/chats/message:
    post:
      tags: [Chats]
      summary: Ask a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                chat: { type: string }
                stream: { type: boolean, default: true }
      responses:
        "201": { description: Non-streaming answer }
        "200": { description: SSE stream when stream=true }
        "429": { description: Daily quota exhausted }
  /api/chats/{chatId}/messages:
    get:
      tags: [Chats]
      summary: Read a thread
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Messages }
        "404": { description: Not found for this user }
  /api/public/chats/{shareId}:
    get:
      tags: [Public]
      summary: Read a shared thread
      parameters:
        - name: shareId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Shared chat and sources }
        "404": { description: Invalid share id }
