services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - researchdesk-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/researchdesk
      JWT_SECRET: local-docker-secret-change-me
      GROQ_API_KEY: replace-me
      TAVILY_API_KEY: replace-me
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:5173

volumes:
  researchdesk-mongo:
